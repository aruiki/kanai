name: Local model or runtime compatibility
description: Report reproducible behavior with a user-supplied local AI model. Do not upload the model or private prompts.
title: "[model]: "
labels:
  - model
  - triage
body:
  - type: markdown
    attributes:
      value: |
        KanaAI does not bundle or endorse models. Never attach model weights, API keys, real prompts, personal text, or proprietary model terms.
        Use synthetic input. The local semantic reranker and writing-assist paths have different consent and payload boundaries.

  - type: input
    id: model
    attributes:
      label: Model name and exact version
      description: Include the public model card or repository when available.
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Model and runtime license
      description: State the license identifiers or link to public terms. Do not paste private terms.
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Model server and version
      description: "Example: llama.cpp, version, and OpenAI-compatible endpoint version if known."
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Host, accelerator, RAM, and model storage
      description: Include OS, CPU architecture, GPU/VRAM, system RAM, quantization, and context size.
    validations:
      required: true

  - type: dropdown
    id: path
    attributes:
      label: KanaAI model path
      options:
        - Optional writing assist
        - Hardware/tier recommendation only
        - Proposed future reranker
        - Other or unclear
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Sanitized configuration
      description: Show endpoint class, model ID, timeout, and flags. Remove secrets and local usernames.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      placeholder: |
        1. Start the local server with ...
        2. Set KANA_AI_BASE_URL and KANA_AI_MODEL to ...
        3. Invoke the operation with ...
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: Include timing methodology and whether latency was a cold or warm run. Do not claim quality from one anecdote.
    validations:
      required: true
